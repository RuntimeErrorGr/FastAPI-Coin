[project]
name = "coin-api"
version = "0.1.0"
description = "A basic coin exchange API."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "redis",
    "httpx",
    "pydantic-settings",
    "tenacity",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pwdlib[argon2]",
    "email-validator",
    "pyjwt",
    "python-multipart"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "ruff"
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["__init__.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["E501", "B008", "D103", "D104", "D107", "D100", "D417"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["D"]
"tests/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
omit = ["app/server.py"]
concurrency = ["greenlet", "thread"]
services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - coinapi

  coinapi:
    build:
      context: .
      target: dev
    image: coinapi/api
    deploy:
      replicas: 3
    env_file: .env
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
    depends_on:
      - redis

  redis:
    image: redis:alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    expose:
      - "6379"

volumes:
  redis_data:
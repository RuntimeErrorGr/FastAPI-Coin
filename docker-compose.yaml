x-app-build: &app-build
  context: .
  target: dev
  args:
    APP_UID: ${APP_UID:-1000}

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - coinapi

  coinapi:
    build: *app-build
    image: coinapi/api
    deploy:
      replicas: 1
    env_file: .env
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  migrate:
    build: *app-build
    image: coinapi/api
    entrypoint: ["alembic"]
    command: ["upgrade", "head"]
    env_file: .env
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
    depends_on:
      postgres:
        condition: service_healthy

  beat:
    build: *app-build
    image: coinapi/api
    entrypoint: ["celery"]
    command:
      - "--app=app.worker.celery_app"
      - "beat"
      - "--schedule=/tmp/celerybeat-schedule"
      - "--loglevel=info"
    env_file: .env
    volumes:
      - ./app:/app/app
    depends_on:
      redis:
        condition: service_started

  worker:
    build: *app-build
    image: coinapi/api
    deploy:
      replicas: 1
    entrypoint: ["celery"]
    command:
      - "--app=app.worker.celery_app"
      - "worker"
      - "--task-events"
      - "--loglevel=info"
    env_file: .env
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_started
      mailpit:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  flower:
    image: mher/flower:2.0.1
    command:
      - "celery"
      - "--broker=redis://:${REDIS_PASSWORD}@redis:6379/${CELERY_BROKER_DB:-1}"
      - "flower"
      - "--port=5555"
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_started

  portainer:
    image: portainer/portainer-ce:2.27.3
    command:
      - "--admin-password=$$2y$$05$$Qrgu047Md1T1L2qakc1bN..yH1L6L/NZuKiVDEg5llLbg3NyNUN8a"
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
    expose:
      - "1025"

  redis:
    image: redis:alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    expose:
      - "6379"

  postgres:
    image: postgres:17-alpine
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 10
    expose:
      - "5432"

volumes:
  redis_data:
  pg_data:
  portainer_data:

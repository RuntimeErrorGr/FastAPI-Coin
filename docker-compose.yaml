x-app-build: &app-build
  context: .
  target: dev
  args:
    APP_UID: ${APP_UID:-1000}

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - coinapi

  coinapi:
    build: *app-build
    image: coinapi/api
    deploy:
      replicas: 1
    env_file: .env
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  migrate:
    build: *app-build
    image: coinapi/api
    entrypoint: ["alembic"]
    command: ["upgrade", "head"]
    env_file: .env
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: *app-build
    image: coinapi/api
    entrypoint: ["celery"]
    command:
      - "--app=app.worker.celery_app"
      - "worker"
      - "--beat"
      - "--schedule=/tmp/celerybeat-schedule"
      - "--loglevel=info"
    env_file: .env
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_started
      mailpit:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
    expose:
      - "1025"

  redis:
    image: redis:alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    expose:
      - "6379"

  postgres:
    image: postgres:17-alpine
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 15
    expose:
      - "5432"

volumes:
  redis_data:
  pg_data:

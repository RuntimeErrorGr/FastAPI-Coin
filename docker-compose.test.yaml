name: fastapi-coin-test

services:
  postgres:
    image: postgres:17-alpine
    env_file: .env
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    image: redis:alpine
    command: redis-server --save "" --requirepass ${REDIS_PASSWORD}
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD --no-auth-warning ping | grep -q PONG"]
      interval: 2s
      timeout: 5s
      retries: 15

  tests:
    build:
      context: .
      target: test
      args:
        APP_UID: ${APP_UID:-1000}
    image: coinapi/tests
    env_file: .env
    environment:
      - ENV=test
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
